<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Chirp wordmark. The mouth is one 4-point path (tip, root, tip, a single
  shared back vertex, close) rather than two separately-closed triangles --
  one shared back vertex instead of two nearly-coincident ones means no
  seam to worry about, even under anti-aliasing. Three small accent
  triangles sit near the tips. "Chirp" sits to the right.

  Meant to be inlined later (per the generic embed's Shadow DOM and the
  Canary widget's page-level styles) -- colors use var(--accent)/var(--text)
  with fallbacks, so it inherits the host's tokens where they exist
  (Canary sites, per chirp.css) and still renders sensibly where they
  don't (generic-embed sites, which chirp-widget.js already assumes have
  no such tokens).
-->

